name: "codemap collide check"
description: "Pair-build the open PRs that share hot files, so a merge-order collision goes red before it lands."
author: "JordanCoin"

branding:
  icon: "git-merge"
  color: "red"

inputs:
  target-repo:
    description: "owner/name whose open PRs are read. Defaults to the repo running the workflow."
    required: false
    default: ""
  target-dir:
    description: "Path to a git checkout of target-repo. Must be a full clone (fetch-depth: 0)."
    required: false
    default: ""
  build-command:
    description: "Command run inside each merged worktree. Non-zero exit = the pair collides."
    required: false
    default: "go build ./... && go vet ./..."
  min-importers:
    description: "Hide shared files with fewer importers than this. 0 shows every hazard."
    required: false
    default: "0"
  base-branch:
    description: "Branch the pairs are merged onto. Defaults to target-repo's default branch."
    required: false
    default: ""
  codemap-version:
    description: "codemap release to download. The tarball also carries ast-grep, so importer counts are real."
    required: false
    default: "4.5.1"
  comment:
    description: "Post a sticky comment on this PR (and on the other half of any failing pair). Needs pull-requests: write."
    required: false
    default: "true"
  all-pairs:
    description: "Build every predicted pair, not only the ones that include this-pr."
    required: false
    default: "false"
  pair-timeout:
    description: "Seconds allowed for one pair's build before it is reported as timed out."
    required: false
    default: "600"
  github-token:
    description: "Token gh uses to read target-repo's open PRs and fetch their heads."
    required: true
  this-pr:
    description: "Number of the PR this run belongs to. When set, the check fails only if THIS PR is part of a pair that does not build; other failing pairs are reported but do not fail the run."
    required: false
    default: ""

# The action installs nothing but codemap. Whatever toolchain build-command
# needs (Go, Node, Rust) is the workflow's job to set up before this step.
runs:
  using: composite
  steps:
    - name: Run collide check
      shell: bash
      env:
        TARGET_REPO: ${{ inputs.target-repo != '' && inputs.target-repo || github.repository }}
        TARGET_DIR: ${{ inputs.target-dir != '' && inputs.target-dir || github.workspace }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        MIN_IMPORTERS: ${{ inputs.min-importers }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        CODEMAP_VERSION: ${{ inputs.codemap-version }}
        COMMENT: ${{ inputs.comment }}
        ALL_PAIRS: ${{ inputs.all-pairs }}
        PAIR_TIMEOUT: ${{ inputs.pair-timeout }}
        GH_TOKEN: ${{ inputs.github-token }}
        THIS_PR: ${{ inputs.this-pr }}
        CALIBRATION_OUT: ${{ runner.temp }}/collide-calibration.jsonl
      run: bash "$GITHUB_ACTION_PATH/scripts/collide-check.sh"

name: collide

# Two ways in:
#   pull_request      — checks this repo's own open PRs against each other.
#   workflow_dispatch — points the same check at another repo's open PRs.
#
# Secrets: none are needed for the pull_request path (GITHUB_TOKEN reads this
# repo). Pointing `target-repo` at a DIFFERENT repo needs a repo-scoped PAT
# stored as the secret CODEMAP_TARGET_TOKEN — GITHUB_TOKEN is scoped to this
# repo alone and cannot read another repo's PRs. This workflow does not create
# that secret; add it under Settings → Secrets and variables → Actions.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      target-repo:
        description: "owner/name whose open PRs get pair-built"
        required: false
        default: "JordanCoin/codemap"
      build-command:
        description: "Command run in each merged worktree"
        required: false
        default: "go build ./... && go vet ./..."
      min-importers:
        description: "Hide shared files with fewer importers than this"
        required: false
        default: "0"
      all-pairs:
        description: "Build every predicted pair"
        required: false
        default: "true"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: collide-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collide:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the target
        id: target
        env:
          INPUT_TARGET: ${{ github.event.inputs.target-repo }}
        run: |
          set -euo pipefail
          target="${INPUT_TARGET:-${{ github.repository }}}"
          echo "repo=$target" >>"$GITHUB_OUTPUT"
          if [ "$target" = "${{ github.repository }}" ]; then
            echo "same=true" >>"$GITHUB_OUTPUT"
          else
            echo "same=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out codemap-ci (the action itself)
        uses: actions/checkout@v7
        with:
          path: codemap-ci

      # Full history: the check merges PR heads onto the base branch in throwaway
      # worktrees, which a shallow clone cannot do.
      - name: Check out the target repo
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.target.outputs.repo }}
          path: target
          fetch-depth: 0
          token: ${{ steps.target.outputs.same == 'true' && github.token || secrets.CODEMAP_TARGET_TOKEN }}

      # The demo repo's build command is Go; the action itself installs only codemap.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false

      - name: Pair-build the predicted collisions
        uses: ./codemap-ci
        with:
          target-repo: ${{ steps.target.outputs.repo }}
          target-dir: ${{ github.workspace }}/target
          build-command: ${{ github.event.inputs.build-command || 'go build ./... && go vet ./...' }}
          min-importers: ${{ github.event.inputs.min-importers || '0' }}
          github-token: ${{ steps.target.outputs.same == 'true' && github.token || secrets.CODEMAP_TARGET_TOKEN }}
          this-pr: ${{ github.event.pull_request.number || '' }}
          all-pairs: ${{ github.event.inputs.all-pairs || 'false' }}

      # One JSON line per built pair: predicted likelihood next to the real
      # outcome. Download a few weeks of these to learn the actual hit rate.
      - name: Keep the calibration log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collide-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/collide-calibration.jsonl
          if-no-files-found: ignore
          retention-days: 90
